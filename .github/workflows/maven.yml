name: Build

on: [push, pull_request]

jobs:
  buildAndTest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - name: Build and test
        run: mvn -B -s .github/workflows/settings.xml clean verify
      - name: Verify plugin artifact
        run: scripts/verify-package.sh Minepacks/target/MinepacksForked-*.jar
