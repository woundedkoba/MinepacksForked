name: Build and release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - name: Build and test once from a clean checkout
        run: mvn -B -s .github/workflows/settings.xml clean verify
      - name: Verify packaged plugin
        run: scripts/verify-package.sh Minepacks/target/MinepacksForked-*.jar
      - name: Upload the single plugin artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" Minepacks/target/MinepacksForked-*.jar --clobber
